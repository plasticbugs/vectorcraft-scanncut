[package]
name = "vectorcraft-fcm"
description = "VectorCraft exporter plug-in: Brother ScanNCut FCM cut files"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone: builds for wasm32-unknown-unknown (the plug-in) and the host (its tests).
[workspace]
exclude = ["host-check"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
